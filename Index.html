<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body data-page="home">
<div id="site-header"></div>
<main>
<section class="hero bg-home">
  <div class="container">
    <p class="eyebrow">University of Eldoret</p>
    <h1>Find What You Need,<span>Around Campus</span></h1>
    <p>Discover water depots, gas suppliers and electronics shops near you. Get essential services, contact details and more, all in one place.</p>
    <form class="searchbar home" id="hero-search" role="search">
      <input name="q" type="search" placeholder="Search for a supplier (e.g. water depot, gas, electronics...)" aria-label="Search for a supplier">
      <button type="submit">Search</button>
    </form>
  </div>
</section>

<section class="section" id="categories">
  <div class="container">
    <h2>Browse by Category</h2>
    <div class="cat-grid" id="cat-grid"></div>
    <div class="features">
      <div class="feature"><p><strong>Easy to find</strong><span>nearby suppliers</span></p></div>
      <div class="feature"><p><strong>Contact details</strong><span>and services</span></p></div>
      <div class="feature"><p><strong>Save time</strong><span>and effort</span></p></div>
    </div>
  </div>
</section>
</main>
<div id="site-footer"></div>
